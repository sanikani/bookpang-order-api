server:
  port: ${PORT:10366}

spring:
  application:
    name: order-api
  datasource:
    url: jdbc:mysql://${BENCHMARK_DB_HOST:localhost}:${BENCHMARK_DB_PORT:3306}/${BENCHMARK_DB_NAME:order-api}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${BENCHMARK_DB_USERNAME:ssafy}
    password: ${BENCHMARK_DB_PASSWORD:ssafy}
  jpa:
    open-in-view: false
    show-sql: false
    hibernate:
      ddl-auto: create
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
        generate_statistics: false
  cloud:
    config:
      enabled: false
    discovery:
      enabled: false
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
    virtual-host: sajotuna

eureka:
  client:
    enabled: false
    register-with-eureka: false
    fetch-registry: false

toss:
  payment:
    secret-key: test_sk_benchmark_local_only

stock:
  strategy:
    default-mode: optimistic
    hot-mode: pessimistic
  retry:
    optimistic:
      max-attempts: 3
      delay: 10
      multiplier: 1.5
  hot-isbns:
    - HOT-ISBN-0001
    - HOT-ISBN-0002
    - HOT-ISBN-0003
    - HOT-ISBN-0004
    - HOT-ISBN-0005

rabbitmq:
  point:
    queue: sajotuna.point.queue
    exchange: sajotuna.point.exchange
    routing-key: sajotuna.point.earn
    dlx-queue: sajotuna.point.dlq
    dlx-exchange: sajotuna.point.dlx
    dlx-routing-key: sajotuna.point.earn.error
    parking-lot-queue: sajotuna.point.parking.queue
    parking-lot-exchange: sajotuna.point.parking.exchange
    parking-lot-routing-key: sajotuna.point.earn.dead
  coupon:
    queue: sajotuna.coupon.queue
    exchange: sajotuna.coupon.exchange
    routing-key: sajotuna.coupon.earn
    dlx-queue: sajotuna.coupon.dlq
    dlx-exchange: sajotuna.coupon.dlx
    dlx-routing-key: sajotuna.coupon.earn.error
    parking-lot-queue: sajotuna.coupon.parking.queue
    parking-lot-exchange: sajotuna.coupon.parking.exchange
    parking-lot-routing-key: sajotuna.coupon.earn.dead
  order:
    queue: sajotuna.order.queue
    exchange: sajotuna.order.exchange
    routing-key: sajotuna.order.earn
    dlx-queue: sajotuna.order.dlq
    dlx-exchange: sajotuna.order.dlx
    dlx-routing-key: sajotuna.order.earn.error

management:
  health:
    config:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,beans,env
      base-path: /actuator
  endpoint:
    health:
      show-details: always
  metrics:
    distribution:
      percentiles:
        http.server.requests: 0.5,0.95,0.99
      percentiles-histogram:
        http.server.requests: true
    export:
      prometheus:
        enabled: true
